name: Promo align
on:
  push:
    branches: [promo-align]
permissions:
  contents: write
jobs:
  align:
    if: "!contains(github.event.head_commit.message, '[out]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q openai-whisper --extra-index-url https://download.pytorch.org/whl/cpu
      - run: cd align && mkdir -p out && python align.py 2>&1 | tee out/log.txt
      - if: always()
        run: |
          git config user.name gs-bot && git config user.email bot@users.noreply.github.com
          git add align/out && git commit -m "align [out]" && git push
