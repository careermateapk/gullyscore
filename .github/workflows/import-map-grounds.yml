name: Import map grounds

# Adds every cricket ground in India from OpenStreetMap (free) to the online
# grounds list. Runs once a month and can be started by hand (Run workflow).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - "server/scripts/import-map.mjs"
      - ".github/workflows/import-map-grounds.yml"

concurrency:
  group: import-map-grounds
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Read grounds from the map
        run: node scripts/import-map.mjs /tmp/map-grounds.sql && wc -l /tmp/map-grounds.sql

      - name: Find the database
        env:
          GIVEN_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_ACCOUNT_ID="$GIVEN_ACCOUNT_ID"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | python3 -c "import json,sys;r=json.load(sys.stdin).get('result') or [];print(r[0]['id'] if r else '')")
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          export CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 d1 list --json > /tmp/d1.json
          id=$(python3 -c "import json;print(next((d['uuid'] for d in json.load(open('/tmp/d1.json')) if d['name']=='gullyscore'),''))")
          if [ -z "$id" ]; then echo "::error::Database not found. Run 'Deploy online service' first."; exit 1; fi
          sed -i "s/REPLACED_BY_DEPLOY/$id/" wrangler.toml

      - name: Add them to the online grounds list
        run: |
          npx --yes wrangler@4 d1 migrations apply gullyscore --remote
          npx --yes wrangler@4 d1 execute gullyscore --remote --yes --file /tmp/map-grounds.sql
          n=$(npx --yes wrangler@4 d1 execute gullyscore --remote --json --command "SELECT COUNT(*) AS n FROM grounds WHERE place_id LIKE 'osm:%'" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['results'][0]['n'])")
          echo "::notice::Map grounds online now: $n"
