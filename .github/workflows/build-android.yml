name: Build Android app

# Runs on every change pushed to main, and can be started by hand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          flutter --version
          ci/run_and_report.sh flutter create . --platforms android --org in.gullyscore --project-name gullyscore
          rm -f test/widget_test.dart
          sed -i 's/android:label="gullyscore"/android:label="GullyScore"/' android/app/src/main/AndroidManifest.xml
          # Let Android back up app data to the user's Google account (restored on reinstall)
          sed -i 's#<application#<application android:allowBackup="true"#' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="true"' android/app/src/main/AndroidManifest.xml
          python3 ci/patch_signing.py
          # Newer Flutter writes the package as `in`.gullyscore (Kotlin style) in Gradle too; Gradle wants plain in.gullyscore
          sed -i 's/`in`\./in./g' android/app/build.gradle.kts
          grep -n "namespace\|applicationId" android/app/build.gradle.kts
          # Firebase needs Android 7 (API 24) or newer
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(24, flutter.minSdkVersion)/' android/app/build.gradle.kts || true
          grep -n "minSdk" android/app/build.gradle* || true
          # Location (grounds near you) and notifications
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Voice scoring: the phone's speech service must be visible to the app
          if grep -q "<queries>" android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<queries>#<queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService"/>\n        </intent>#' android/app/src/main/AndroidManifest.xml
          else
            sed -i 's#</manifest>#    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService"/>\n        </intent>\n    </queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          fi
          grep -n "RecognitionService\|RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          # GullyScore's own app icon (instead of Flutter's default)
          cp -r ci/icon/res/. android/app/src/main/res/
          ls android/app/src/main/res/mipmap-anydpi-v26

      - name: Google Maps key and Firebase settings
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            python3 - <<'PY'
          import os, re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          meta = '<meta-data android:name="com.google.android.geo.API_KEY" android:value="%s"/>' % os.environ['MAPS_API_KEY']
          s = re.sub(r'(<application[^>]*>)', lambda m: m.group(1) + '\n        ' + meta, s, count=1)
          open(p, 'w').write(s)
          PY
            echo "MAPS_ON=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Google map is off in this build (add the MAPS_API_KEY secret)."
            echo "MAPS_ON=false" >> "$GITHUB_ENV"
          fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          c = json.load(open('firebase-app.json'))
          print('FB_PROJECT=' + c.get('projectId', '').strip())
          print('FB_API_KEY=' + c.get('apiKey', '').strip())
          print('FB_APP_ID=' + c.get('appId', '').strip())
          print('FB_SENDER=' + c.get('senderId', '').strip())
          PY
          grep -c "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Find the online service address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url=""
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | python3 -c "import json,sys
          try:
              r=json.load(sys.stdin).get('result') or []
              print(r[0]['id'] if r else '')
          except Exception:
              print('')")
          fi
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import json,sys
          try:
              print(json.load(sys.stdin)['result']['subdomain'] or '')
          except Exception:
              print('')")
            [ -n "$sub" ] && url="https://gullyscore-api.$sub.workers.dev"
          fi
          if [ -z "$url" ]; then echo "::warning::Online features are off in this build (Cloudflare not connected yet)."; else echo "Online service: $url"; fi
          echo "CLOUD_URL=$url" >> "$GITHUB_ENV"
          cid=$(tr -d '[:space:]' < google-client-id.txt 2>/dev/null || true)
          if [ -z "$cid" ]; then echo "::warning::Player login is off in this build (google-client-id.txt is empty)."; fi
          echo "GOOGLE_CLIENT_ID=$cid" >> "$GITHUB_ENV"

      - name: Get packages
        run: ci/run_and_report.sh flutter pub get

      - name: Check formatting-independent code problems
        run: ci/run_and_report.sh flutter analyze --no-fatal-infos

      - name: Run tests
        run: ci/run_and_report.sh flutter test

      - name: Accept Android SDK licenses (maps and Firebase download extra SDK parts)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | flutter doctor --android-licenses > /dev/null || true

      - name: Build APK
        run: |
          ci/run_and_report.sh flutter build apk --release --dart-define=CLOUD_URL=${{ env.CLOUD_URL }} --dart-define=GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }} --dart-define=MAPS_ON=${{ env.MAPS_ON }} --dart-define=FB_PROJECT=${{ env.FB_PROJECT }} --dart-define=FB_API_KEY=${{ env.FB_API_KEY }} --dart-define=FB_APP_ID=${{ env.FB_APP_ID }} --dart-define=FB_SENDER=${{ env.FB_SENDER }}
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/GullyScore-all-phones.apk

      - name: Build smaller APKs (one per phone type)
        run: |
          ci/run_and_report.sh flutter build apk --release --split-per-abi --dart-define=CLOUD_URL=${{ env.CLOUD_URL }} --dart-define=GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }} --dart-define=MAPS_ON=${{ env.MAPS_ON }} --dart-define=FB_PROJECT=${{ env.FB_PROJECT }} --dart-define=FB_API_KEY=${{ env.FB_API_KEY }} --dart-define=FB_APP_ID=${{ env.FB_APP_ID }} --dart-define=FB_SENDER=${{ env.FB_SENDER }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/GullyScore-most-phones.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/GullyScore-older-phones.apk
          ls -la dist

      - name: Publish APK for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GullyScore build ${{ github.run_number }}
          body: |
            Download GullyScore-most-phones.apk (smallest, works on most phones made after 2017).
            If it does not install, use GullyScore-all-phones.apk.
            Built from: ${{ github.event.head_commit.message || 'manual run' }}
          prerelease: true
          files: |
            dist/GullyScore-most-phones.apk
            dist/GullyScore-older-phones.apk
            dist/GullyScore-all-phones.apk
