name: Build Android app

# Runs on every change pushed to main, and can be started by hand
# from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project files
        run: |
          flutter --version
          ci/run_and_report.sh flutter create . --platforms android --org in.gullyscore --project-name gullyscore
          rm -f test/widget_test.dart
          sed -i 's/android:label="gullyscore"/android:label="GullyScore"/' android/app/src/main/AndroidManifest.xml
          # Let Android back up app data to the user's Google account (restored on reinstall)
          sed -i 's#<application#<application android:allowBackup="true"#' android/app/src/main/AndroidManifest.xml
          grep -q 'allowBackup="true"' android/app/src/main/AndroidManifest.xml
          python3 ci/patch_signing.py

      - name: Find the online service address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          url=""
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c "import json,sys
          try:
              print(json.load(sys.stdin)['result']['subdomain'] or '')
          except Exception:
              print('')")
            [ -n "$sub" ] && url="https://gullyscore-api.$sub.workers.dev"
          fi
          if [ -z "$url" ]; then echo "::warning::Online features are off in this build (Cloudflare not connected yet)."; else echo "Online service: $url"; fi
          echo "CLOUD_URL=$url" >> "$GITHUB_ENV"

      - name: Get packages
        run: ci/run_and_report.sh flutter pub get

      - name: Check formatting-independent code problems
        run: ci/run_and_report.sh flutter analyze --no-fatal-infos

      - name: Run tests
        run: ci/run_and_report.sh flutter test

      - name: Build APK
        run: |
          ci/run_and_report.sh flutter build apk --release --dart-define=CLOUD_URL=${{ env.CLOUD_URL }}
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/GullyScore-all-phones.apk

      - name: Build smaller APKs (one per phone type)
        run: |
          ci/run_and_report.sh flutter build apk --release --split-per-abi --dart-define=CLOUD_URL=${{ env.CLOUD_URL }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/GullyScore-most-phones.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/GullyScore-older-phones.apk
          ls -la dist

      - name: Publish APK for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GullyScore build ${{ github.run_number }}
          body: |
            Download GullyScore-most-phones.apk (smallest, works on most phones made after 2017).
            If it does not install, use GullyScore-all-phones.apk.
            Built from: ${{ github.event.head_commit.message || 'manual run' }}
          prerelease: true
          files: |
            dist/GullyScore-most-phones.apk
            dist/GullyScore-older-phones.apk
            dist/GullyScore-all-phones.apk
